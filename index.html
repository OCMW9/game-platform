<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Platform</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #090b14;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

header {
    height: 75px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6%;
    background: #101321;
    border-bottom: 1px solid #24283d;
}

.logo {
    font-size: 23px;
    font-weight: bold;
    color: #a78bfa;
}

header button {
    background: #7c3aed;
    border: none;
    color: white;
    padding: 11px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

header button:hover {
    background: #6d28d9;
}

main {
    max-width: 1200px;
    margin: auto;
    padding: 45px 25px;
}

.welcome {
    margin-bottom: 35px;
}

.welcome h1 {
    font-size: 36px;
    margin-bottom: 12px;
}

.welcome p {
    color: #9298b4;
}

.search {
    width: 100%;
    padding: 15px;
    background: #151a2b;
    border: 1px solid #292f49;
    border-radius: 10px;
    color: white;
    font-size: 15px;
    margin-bottom: 35px;
    outline: none;
}

.search:focus {
    border-color: #8b5cf6;
}

.section-title {
    font-size: 21px;
    margin-bottom: 20px;
}

.games {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

.game-card {
    background: #151a2b;
    border: 1px solid #252b43;
    border-radius: 13px;
    overflow: hidden;
    transition: 0.2s;
    cursor: pointer;
}

.game-card:hover {
    transform: translateY(-5px);
    border-color: #8b5cf6;
}

.game-image {
    height: 145px;
    background: linear-gradient(135deg, #312e81, #7c3aed);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
}

.game-info {
    padding: 17px;
}

.game-info h3 {
    margin-bottom: 8px;
}

.game-info p {
    color: #9298b4;
    font-size: 13px;
}

.empty {
    color: #9298b4;
    margin-top: 20px;
    display: none;
}

footer {
    text-align: center;
    color: #626985;
    padding: 40px;
    font-size: 13px;
}
</style>
</head>

<body>

<header>
    <div class="logo">GAME PLATFORM</div>
    <button onclick="openBlank()">Open in about:blank ↗</button>
</header>

<main>

    <section class="welcome">
        <h1>Your Games. Your World.</h1>
        <p>Choose a game and jump in.</p>
    </section>

    <input
        class="search"
        type="text"
        id="search"
        placeholder="Search games..."
        oninput="searchGames()"
    >

<h2 class="section-title">All Games</h2>

<div class="games" id="games">

    <!-- Games will be added here -->

    <div class="game-card" data-name="coming soon">
        <div class="game-image">🎮</div>
        <div class="game-info">
            <h3>Coming Soon</h3>
            <p>More games are on the way.</p>
        </div>
    </div>

</div>

    <p class="empty" id="empty">No games found.</p>

</main>

<footer>
    Game Platform • Built for multiplayer gaming
</footer>

<script>
async function loadGames() {
    const container = document.getElementById("games");

    try {
        const response = await fetch("games.json?v=" + Date.now());

        if (!response.ok) throw new Error("Could not load games");

        const data = await response.json();
        container.innerHTML = "";

        data.games.forEach(game => {
            const card = document.createElement("div");
            card.className = "game-card";
            card.dataset.name = game.name.toLowerCase();

            const image = document.createElement("div");
            image.className = "game-image";
            image.textContent = game.image || "🎮";

            const info = document.createElement("div");
            info.className = "game-info";

            const title = document.createElement("h3");
            title.textContent = game.name;

            const description = document.createElement("p");
            description.textContent = game.description;

            info.appendChild(title);
            info.appendChild(description);

            card.appendChild(image);
            card.appendChild(info);

            if (game.url) {
                const actions = document.createElement("div");
                actions.style.padding = "12px";

                const play = document.createElement("button");
                play.textContent = "Play";
                play.onclick = () => {
                    const viewer = new URL("game.html", document.baseURI);
                    viewer.searchParams.set("url", game.url);
                    viewer.searchParams.set("title", game.name);
                    window.location.href = viewer.href;
                };

                const newTab = document.createElement("button");
                newTab.textContent = "Open in New Tab";
                newTab.style.marginLeft = "8px";
                newTab.onclick = () => {
                    window.open(game.url, "_blank", "noopener,noreferrer");
                };

                actions.appendChild(play);
                actions.appendChild(newTab);
                card.appendChild(actions);
            }

            container.appendChild(card);
        });

        searchGames();

    } catch (error) {
        container.innerHTML =
            "<p>Unable to load games. Please try again later.</p>";
        console.error(error);
    }
}

async function openBlank() {
    const newTab = window.open("about:blank", "_blank");

    if (!newTab) {
        alert("Please allow pop-ups for this website.");
        return;
    }

    newTab.document.write(`
        <html>
        <body style="background:#090b14;color:white;font-family:Arial;display:grid;place-items:center;height:100vh;">
            <h2>Loading Game Platform...</h2>
        </body>
        </html>
    `);

    try {
        const response = await fetch(
            "https://raw.githubusercontent.com/OCMW9/game-platform/main/index.html?v=" + Date.now(),
            { cache: "no-store" }
        );

        if (!response.ok) throw new Error("Could not load platform");

        let html = await response.text();

        html = html.replace(
            /<head([^>]*)>/i,
            '$&<base href="https://ocmw9.github.io/game-platform/">'
        );

        newTab.document.open();
        newTab.document.write(html);
        newTab.document.close();

    } catch (error) {
        newTab.document.open();
        newTab.document.write("<h2>Unable to load Game Platform. Please try again.</h2>");
        newTab.document.close();
    }
}

loadGames();
</script>

</body>
</html>
